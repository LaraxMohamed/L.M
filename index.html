<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Dynamic Safari Status Bar Color -->
    <meta name="theme-color" id="theme-color-meta" content="#1a050f">
    
    <title>16.09</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* THE NOTCH FIX: The background color is now controlled by JS to match the aura exactly */
        body { 
            background-color: #1a050f; /* Base Dark Pink */
            color: #ffffff; 
            width: 100vw; height: 100dvh;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; overscroll-behavior: none;
            display: flex; justify-content: center; align-items: center; 
            transition: background-color 1.5s ease;
        }

        /* High-End Cross-Fading Auras with Distinct Colors */
        .ambient-layer {
            position: absolute; top: -20%; left: -20%; width: 140%; height: 140%;
            opacity: 0; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1; filter: blur(40px);
            animation: slow-drift 15s infinite alternate ease-in-out;
            will-change: opacity;
        }
        .ambient-layer.active { opacity: 1; }
        
        /* Bright, Soft Pastel Pink for Love */
        #aura-love {
            background: radial-gradient(circle at 10% 20%, rgba(255, 154, 158, 0.4), transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(254, 207, 239, 0.4), transparent 60%),
                        radial-gradient(circle at 50% 50%, rgba(255, 182, 193, 0.3), transparent 60%);
        }
        /* Calming Violet for Miss You */
        #aura-miss {
            background: radial-gradient(circle at 10% 20%, rgba(90, 50, 220, 0.4), transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(120, 80, 255, 0.4), transparent 60%),
                        radial-gradient(circle at 50% 50%, rgba(50, 20, 150, 0.3), transparent 60%);
        }
        /* Deep, Dark Blood-Red for Urgent/Angry */
        #aura-urgent {
            background: radial-gradient(circle at 10% 20%, rgba(220, 0, 0, 0.5), transparent 60%),
                        radial-gradient(circle at 90% 80%, rgba(150, 0, 0, 0.55), transparent 60%),
                        radial-gradient(circle at 50% 50%, rgba(90, 0, 0, 0.4), transparent 60%);
        }
        @keyframes slow-drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-2%, -2%) scale(1.05); } }

        /* Continuous Background Particles */
        #ambient-fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: hidden; }
        .bg-particle { position: absolute; bottom: -50px; pointer-events: none; animation: floatToTop linear forwards; will-change: transform, opacity; }
        @keyframes floatToTop { to { transform: translateY(-120vh) rotate(45deg); opacity: 0; } }

        .mobile-container { width: 100%; max-width: 420px; height: 100%; position: relative; z-index: 10; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; -ms-overflow-style: none; scrollbar-width: none; }
        .mobile-container::-webkit-scrollbar { display: none; }

        /* Safe area padding applied dynamically to the individual screens */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.5s ease, visibility 0.5s; background: transparent; 
            padding: calc(40px + env(safe-area-inset-top)) 25px calc(20px + env(safe-area-inset-bottom)) 25px; 
            visibility: visible; 
        }
        .hidden { opacity: 0; pointer-events: none; visibility: hidden; }
        .slide-hidden { opacity: 0; pointer-events: none; transform: translateY(20px); visibility: hidden; transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s; }

        .music-btn { position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 100; backdrop-filter: blur(12px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .music-btn:active { transform: scale(0.85); background: rgba(255, 255, 255, 0.2); }

        /* Scanner */
        .auth-text { color: #dcdcdc; font-size: 0.85rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 50px; font-weight: 300; transition: color 0.3s, text-shadow 0.3s; user-select: none; padding: 15px; cursor: pointer; }
        .fingerprint-btn { font-size: 5.5rem; color: rgba(255,255,255,0.12); background: none; border: none; outline: none; cursor: pointer; transition: all 0.4s ease; position: relative; }
        .fingerprint-btn.scanning { color: #ffffff; text-shadow: 0 0 35px rgba(255, 255, 255, 0.9); transform: scale(1.08); }
        .pulse-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0); pointer-events: none; }
        @keyframes scan-pulse { 0% { width: 100px; height: 100px; border-color: rgba(255,255,255, 0.7); } 100% { width: 300px; height: 300px; border-color: rgba(255,255,255, 0); } }

        /* Dashboard */
        #dashboard-screen { justify-content: flex-start; padding-top: calc(60px + env(safe-area-inset-top)); }
        .header-profile { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 35px; }
        .avatar-container { width: 85px; height: 85px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); margin-bottom: 15px; animation: float 4s ease-in-out infinite; box-shadow: 0 10px 25px rgba(255, 154, 158, 0.3); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .custom-avatar { width: 100%; height: 100%; border-radius: 50%; background-color: #0a0a0f; border: 2px solid #050508; display: flex; justify-content: center; align-items: center; font-size: 1.3rem; font-weight: 500; color: #fff; }
        .custom-avatar span { font-size: 0.75em; margin: 0 4px; }
        .greeting h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.5px; color: #ffffff; margin-bottom: 5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

        .streak-pill { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 8px 20px; border-radius: 25px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 8px; margin-top: 10px; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .streak-pill i { color: #ff9a9e; }

        .counter-widget { width: 100%; background: rgba(20, 20, 25, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 28px; padding: 25px 20px; margin-bottom: 25px; backdrop-filter: blur(25px); text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .counter-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 4px; color: #aaa; margin-bottom: 18px; }
        .time-blocks { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .time-block { display: flex; flex-direction: column; align-items: center; width: 22%; }
        .time-value { font-size: 1.6rem; font-weight: 600; color: #ffffff; }
        .time-label { font-size: 0.6rem; color: #777; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 5px; }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; }
        .tile { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 35px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(20px); cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s; text-decoration: none; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .tile:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.1); }
        .tile-icon { font-size: 2.2rem; color: #ffffff; }
        .tile-full { grid-column: span 2; flex-direction: row; gap: 15px; padding: 22px; background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(255,255,255,0.12); }
        .tile-title { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.5px; }
        .tile-vault .tile-icon { color: #f6e58d; filter: drop-shadow(0 0 10px rgba(246, 229, 141, 0.3)); }
        
        .tile-signal .tile-icon { color: #ff9ff3; filter: drop-shadow(0 0 10px rgba(255, 159, 243, 0.3)); animation: floatIcon 3s infinite ease-in-out; }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        /* Premium Chat Screen */
        #communication-screen { justify-content: space-between; padding: calc(20px + env(safe-area-inset-top)) 15px env(safe-area-inset-bottom) 15px; }
        .nav-header { width: 100%; display: flex; align-items: center; padding-top: 10px; margin-bottom: 10px; z-index: 10; }
        .back-btn { font-size: 1.3rem; color: #ccc; cursor: pointer; padding: 10px 15px 10px 0; transition: color 0.3s; }
        .term-header { font-weight: 600; font-size: 1.2rem; margin-left: 5px; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .terminal-box { background: transparent; width: 100%; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 10px 5px; -ms-overflow-style: none; scrollbar-width: none; z-index: 10; }
        .terminal-box::-webkit-scrollbar { display: none; }
        
        /* GPU Accelerated Smooth Chat Physics */
        .msg { 
            display: flex; flex-direction: column; width: 100%; 
            animation: floatIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
            opacity: 0; transform: translateY(15px) translateZ(0); 
            transform-origin: bottom center; 
            will-change: transform, opacity; 
        }
        @keyframes floatIn { to { opacity: 1; transform: translateY(0) translateZ(0); } }
        
        .msg.incoming { align-items: flex-start; }
        .msg.outgoing { align-items: flex-end; }
        .msg-bubble { padding: 14px 20px; border-radius: 22px; font-size: 0.95rem; max-width: 82%; line-height: 1.45; box-shadow: 0 5px 20px rgba(0,0,0,0.2); letter-spacing: 0.2px; transform: translateZ(0); will-change: transform; }
        .msg.incoming .msg-bubble { background: rgba(255, 255, 255, 0.12); border-bottom-left-radius: 6px; color: #fff; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        .msg.outgoing .msg-bubble { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border-bottom-right-radius: 6px; color: #111; font-weight: 500; }
        
        .msg-status { font-size: 0.65rem; color: #bbb; margin-top: 6px; display: flex; align-items: center; gap: 5px; font-weight: 500; letter-spacing: 0.3px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 5px rgba(0,0,0,0.3); }

        .chat-footer { width: 100%; display: flex; flex-direction: column; gap: 12px; background: rgba(15, 15, 20, 0.75); backdrop-filter: blur(25px); padding: 15px; border-radius: 28px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 -10px 40px rgba(0,0,0,0.4); margin-bottom: 10px; z-index: 10; }
        .quick-actions-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
        .quick-actions-row::-webkit-scrollbar { display: none; }
        .chip-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 10px 18px; font-size: 0.85rem; color: #f0f0f0; white-space: nowrap; cursor: pointer; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 8px; font-weight: 500; }
        .chip-btn:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.15); }
        .chip-urgent { border-color: rgba(255, 71, 87, 0.4); color: #ff6b81; background: rgba(255, 71, 87, 0.05); }
        .input-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .chat-input { flex-grow: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.12); color: white; padding: 14px 18px; border-radius: 22px; font-size: 0.95rem; outline: none; transition: border 0.3s, box-shadow 0.3s; }
        .chat-input:focus { border-color: #ff9a9e; box-shadow: 0 0 15px rgba(255, 154, 158, 0.15); }
        .send-btn { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); border: none; color: #111; font-size: 1.15rem; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 5px 15px rgba(255, 154, 158, 0.3); transition: transform 0.2s; }
        .send-btn:active { transform: scale(0.85); }
        
        .tap-particle { position: absolute; pointer-events: none; animation: burstUp 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; z-index: 100; text-shadow: 0 5px 15px rgba(0,0,0,0.3); will-change: transform, opacity; }
        @keyframes burstUp { 0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg) translateZ(0); } 100% { opacity: 0; transform: translateY(-120px) scale(1.5) rotate(25deg) translateZ(0); } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="wayah.m4a" type="audio/mp4">
    </audio>

    <!-- Cross-fading Aura Layers -->
    <div id="aura-love" class="ambient-layer active"></div>
    <div id="aura-miss" class="ambient-layer"></div>
    <div id="aura-urgent" class="ambient-layer"></div>
    
    <!-- Background Floating Particles -->
    <div id="ambient-fx"></div>

    <div class="mobile-container">
        
        <button id="music-toggle" class="music-btn" onclick="toggleMusic()">
            <i class="fa-solid fa-volume-xmark"></i>
        </button>

        <!-- SECURE FINGERPRINT SCANNER -->
        <div id="scanner-screen" class="screen">
            <!-- The secret trigger: 1 Tap on this text arms the scanner -->
            <p class="auth-text" id="status-text">Awaiting Identity</p>
            <button class="fingerprint-btn" id="fingerprint"><i class="fa-solid fa-fingerprint"></i><div class="pulse-ring" id="ring1"></div></button>
        </div>

        <div id="dashboard-screen" class="screen slide-hidden">
            <div class="header-profile">
                <div class="avatar-container"><div class="custom-avatar">L <span>❤️</span> M</div></div>
                <div class="greeting"><h1 id="dynamic-greeting">System 16.09</h1></div>
                <div class="streak-pill"><i class="fa-solid fa-fire"></i><span id="streak-count">Day 1</span></div>
            </div>

            <div class="counter-widget">
                <div class="counter-title">Since 16.09.2026</div>
                <div class="time-blocks">
                    <div class="time-block"><span class="time-value" id="count-days">0</span><span class="time-label">Days</span></div>
                    <div class="time-block"><span class="time-value" id="count-hours">0</span><span class="time-label">Hours</span></div>
                    <div class="time-block"><span class="time-value" id="count-mins">0</span><span class="time-label">Mins</span></div>
                    <div class="time-block"><span class="time-value" id="count-secs">0</span><span class="time-label">Secs</span></div>
                </div>
            </div>

            <div class="grid-container">
                <a href="promise.html" class="tile tile-full">
                    <i class="fa-solid fa-envelope-open-text tile-icon" style="font-size: 1.8rem; margin-bottom: 5px;"></i>
                    <div class="tile-title">The Promise</div>
                </a>
                
                <div class="tile tile-vault" onclick="window.open('https://drive.google.com/drive/folders/1_YeKPVTD_UdM8eOKV3e_R_SaPUmmz2c3?usp=sharing', '_blank')"><i class="fa-solid fa-lock tile-icon"></i></div>
                <div class="tile tile-signal" onclick="openCommMenu()"><i class="fa-solid fa-paper-plane tile-icon"></i></div>
            </div>
        </div>

        <div id="communication-screen" class="screen slide-hidden">
            <div class="nav-header"><i class="fa-solid fa-chevron-left back-btn" onclick="closeCommMenu()"></i><div class="term-header">Our Chat</div></div>
            <div class="terminal-box" id="chat-history"></div>
            
            <div class="chat-footer">
                <div class="quick-actions-row">
                    <div class="chip-btn" onclick="sendQuickNote(this, 'I love you ❤️', 'love')"><i class="fa-solid fa-heart" style="color:#ff9a9e;"></i> I love you</div>
                    <div class="chip-btn" onclick="sendQuickNote(this, 'I miss you! 🫂', 'miss')"><i class="fa-solid fa-hands-holding-circle" style="color:#a29bfe;"></i> I miss you</div>
                    <div class="chip-btn chip-urgent" onclick="sendQuickNote(this, 'We need to talk.', 'urgent')"><i class="fa-solid fa-triangle-exclamation"></i> Urgent</div>
                </div>
                <div class="input-row">
                    <input type="text" id="custom-msg" class="chat-input" placeholder="Type a message..." autocomplete="off">
                    <button class="send-btn" onclick="sendCustomNote(this)"><i class="fa-solid fa-arrow-up"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase DB Logic - ZERO JITTER RENDER SYSTEM -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, serverTimestamp, update } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBrjUFPcoAUuvUGTofcZOjOaT8__dLjdJU",
            authDomain: "project-6743089200855905181.firebaseapp.com",
            databaseURL: "https://project-6743089200855905181-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "project-6743089200855905181",
            storageBucket: "project-6743089200855905181.firebasestorage.app",
            messagingSenderId: "187386380249",
            appId: "1:187386380249:web:9185a2d7c615d890efa3c8",
            measurementId: "G-XQLCMR72R6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.isChatOpen = false;
        window.currentMood = 'love';
        let currentMessages = [];

        window.sendToDatabase = function(messageText, type) {
            push(ref(db, 'messages'), { sender: 'Lara', text: messageText, status: 'Delivered', timestamp: serverTimestamp(), msgType: type });
            push(ref(db, 'aura'), { state: type });
        }

        const chatHistory = document.getElementById('chat-history');
        
        onValue(ref(db, 'messages'), (snapshot) => {
            // WE NO LONGER WIPE THE HTML. This completely cures the vibration bug.
            currentMessages = [];
            
            if(snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    const msg = childSnapshot.val();
                    const msgKey = childSnapshot.key;
                    currentMessages.push({ key: msgKey, ...msg });
                    
                    const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const cssClass = msg.sender === 'Lara' ? 'outgoing' : 'incoming';
                    
                    let statusText = msg.sender === 'Lara' ? `${msg.status || 'Delivered'}` : `Mohamed`;
                    let dotColor = (msg.status === 'Seen') ? '#3b82f6' : '#4ade80';
                    const statusHtml = msg.sender === 'Lara' ? `<div class="status-dot" style="background:${dotColor}"></div> ${statusText} • ${time}` : `${statusText} • ${time}`;
                    
                    const existingMsg = document.getElementById('msg-' + msgKey);
                    
                    if (existingMsg) {
                        // If message is already on screen, just update the status dot (No animation glitch!)
                        const statusDiv = existingMsg.querySelector('.msg-status');
                        if (statusDiv.innerHTML !== statusHtml) {
                            statusDiv.innerHTML = statusHtml;
                        }
                    } else {
                        // If it's a completely new message, inject it at the bottom so it animates beautifully
                        chatHistory.insertAdjacentHTML('beforeend', `
                            <div class="msg ${cssClass}" id="msg-${msgKey}">
                                <div class="msg-bubble">${msg.text}</div>
                                <div class="msg-status">${statusHtml}</div>
                            </div>
                        `);
                        
                        // Snap scroll to bottom only when a brand new message arrives
                        setTimeout(() => { 
                            chatHistory.scrollTop = chatHistory.scrollHeight; 
                        }, 10);
                    }
                });
            }
            if (window.isChatOpen) window.markUnreadAsSeen();
        });

        window.markUnreadAsSeen = function() {
            currentMessages.forEach(msg => {
                if (msg.sender === 'Mohamed' && msg.status !== 'Seen') update(ref(db, 'messages/' + msg.key), { status: 'Seen' });
            });
        }

        const layerLove = document.getElementById('aura-love');
        const layerMiss = document.getElementById('aura-miss');
        const layerUrgent = document.getElementById('aura-urgent');
        const themeMeta = document.getElementById('theme-color-meta');
        
        onValue(ref(db, 'aura'), (snapshot) => {
            let latestState = 'love';
            snapshot.forEach((child) => { latestState = child.val().state; });
            window.currentMood = latestState;
            
            layerLove.classList.remove('active');
            layerMiss.classList.remove('active');
            layerUrgent.classList.remove('active');
            
            // Activate Layer & Update BOTH the body background and Safari Address Bar perfectly
            if (latestState === 'urgent') {
                layerUrgent.classList.add('active');
                document.body.style.backgroundColor = '#1a0000'; // Deep Dark Red Fix
                themeMeta.content = '#1a0000'; 
            }
            else if (latestState === 'miss') {
                layerMiss.classList.add('active');
                document.body.style.backgroundColor = '#0d051a'; // Deep Dark Purple Fix
                themeMeta.content = '#0d051a'; 
            }
            else {
                layerLove.classList.add('active');
                document.body.style.backgroundColor = '#1a050f'; // Deep Dark Pink Fix
                themeMeta.content = '#1a050f'; 
            }
        });
    </script>

    <!-- App Logic & Decoy Scanner -->
    <script>
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.15; 
        let isMusicPlaying = false;

        function toggleMusic() {
            const icon = document.querySelector('#music-toggle i');
            if (isMusicPlaying) { bgMusic.pause(); icon.className = 'fa-solid fa-volume-xmark'; } 
            else { bgMusic.play().catch(e => console.log("Audio block")); icon.className = 'fa-solid fa-volume-high'; }
            isMusicPlaying = !isMusicPlaying;
        }

        function startCounter() {
            const startDate = new Date("2026-09-16T00:00:00").getTime();
            setInterval(() => {
                const distance = new Date().getTime() - startDate;
                if (distance > 0) {
                    document.getElementById("count-days").innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                    document.getElementById("count-hours").innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById("count-mins").innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById("count-secs").innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            }, 1000);
        }

        // --- SINGLE-TAP DECOY SCANNER LOGIC ---
        const sText = document.getElementById('status-text');
        const fpBtn = document.getElementById('fingerprint');
        const ring = document.getElementById('ring1');
        
        let isArmed = false;
        let scanTimer;
        let isScanned = false;

        // Hidden lock trigger (1 Tap)
        sText.addEventListener('touchstart', handleSecretTap);
        sText.addEventListener('mousedown', handleSecretTap);

        function handleSecretTap(e) {
            e.preventDefault();
            isArmed = true;
            sText.style.color = "#ffffff";
            sText.style.textShadow = "0 0 10px rgba(255,255,255,0.4)";
        }

        function startScan(e) { 
            if(isScanned) return; if(e) e.preventDefault(); 
            fpBtn.classList.add('scanning'); sText.innerText = "Verifying..."; sText.style.color = "#fff"; ring.style.animation = "scan-pulse 1s ease-out infinite"; 
            
            scanTimer = setTimeout(triggerAccess, 2000); 
        }
        
        function stopScan(e) { 
            if(isScanned) return; if(e) e.preventDefault(); 
            clearTimeout(scanTimer); fpBtn.classList.remove('scanning'); 
            if (!isArmed) {
                sText.innerText = "Awaiting Identity"; sText.style.color = "#dcdcdc"; 
            }
            ring.style.animation = "none"; 
        }
        
        function triggerAccess() { 
            if (isArmed) {
                // Success: She armed it
                isScanned = true; 
                sText.innerText = "Biometrics Accepted."; sText.style.color = "#4ade80"; 
                
                if (!isMusicPlaying) {
                    bgMusic.play().then(() => { document.querySelector('#music-toggle i').className = 'fa-solid fa-volume-high'; isMusicPlaying = true; }).catch(e => console.log("Autoplay blocked"));
                }

                setTimeout(() => { 
                    document.getElementById('scanner-screen').classList.add('hidden'); 
                    startCounter();
                    
                    const hour = new Date().getHours();
                    const greetingEl = document.getElementById('dynamic-greeting');
                    if (hour >= 5 && hour < 12) greetingEl.innerText = "Sabah elkher yhabebte❤️.";
                    else if (hour >= 12 && hour < 18) greetingEl.innerText = "Ahlan habebte❤️.";
                    else greetingEl.innerText = "Ahlan Habebte❤️.";

                    setTimeout(() => { 
                        document.getElementById('scanner-screen').style.display = 'none'; 
                        document.getElementById('dashboard-screen').classList.remove('slide-hidden'); 
                        document.getElementById('dashboard-screen').style.pointerEvents = 'auto'; 
                    }, 400); 
                }, 800); 

            } else {
                // Trap: Someone else tried it without tapping the text first
                sText.innerText = "Biometrics Unrecognized."; sText.style.color = "#ff4757"; sText.style.textShadow = "none";
                fpBtn.classList.remove('scanning'); 
                ring.style.animation = "none"; 
                
                setTimeout(() => {
                    sText.innerText = "Awaiting Identity"; sText.style.color = "#dcdcdc";
                }, 2000);
            }
        }
        
        fpBtn.addEventListener('mousedown', startScan); fpBtn.addEventListener('mouseup', stopScan); fpBtn.addEventListener('mouseleave', stopScan); fpBtn.addEventListener('touchstart', startScan); fpBtn.addEventListener('touchend', stopScan); fpBtn.addEventListener('touchcancel', stopScan);

        // --- DASHBOARD & CHAT LOGIC ---
        const cScreen = document.getElementById('communication-screen'), dScreen = document.getElementById('dashboard-screen');
        window.openCommMenu = function() { 
            dScreen.classList.add('slide-hidden'); 
            setTimeout(() => { 
                dScreen.style.display = 'none'; cScreen.style.display = 'flex'; 
                setTimeout(() => { 
                    cScreen.classList.remove('slide-hidden'); 
                    window.isChatOpen = true; 
                    if(window.markUnreadAsSeen) window.markUnreadAsSeen(); 
                }, 50); 
            }, 400); 
        }
        window.closeCommMenu = function() { 
            window.isChatOpen = false; 
            cScreen.classList.add('slide-hidden'); 
            setTimeout(() => { 
                cScreen.style.display = 'none'; dScreen.style.display = 'flex'; 
                setTimeout(() => dScreen.classList.remove('slide-hidden'), 50); 
            }, 400); 
        }

        window.sendCustomNote = function(btn) {
            const msg = document.getElementById('custom-msg').value.trim();
            if (msg === "") return;
            window.sendToDatabase(msg, 'love');
            spawnTapParticles('love', btn);
            document.getElementById('custom-msg').value = "";
        }
        window.sendQuickNote = function(btn, msg, type) {
            window.sendToDatabase(msg, type);
            spawnTapParticles(type, btn);
        }

        function spawnTapParticles(type, element) {
            const rect = element.getBoundingClientRect(), container = document.body;
            let emojis = ['❤️', '💕', '💖']; 
            if (type === 'miss') emojis = ['✨', '🌌', '💜'];
            if (type === 'urgent') emojis = ['⚠️', '💔'];

            const pCount = Math.floor(Math.random() * 3) + 4; 
            for(let i = 0; i < pCount; i++) {
                const p = document.createElement('div'); 
                p.className = 'tap-particle'; 
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.fontSize = `${Math.random() * 0.5 + 0.8}rem`;
                p.style.left = `${rect.left + (rect.width/2) + ((Math.random() - 0.5) * 60)}px`; 
                p.style.top = `${rect.top + (rect.height/2)}px`;
                p.style.animationDuration = `${1.2 + Math.random() * 0.8}s`; 
                container.appendChild(p);
                setTimeout(() => p.remove(), 2500);
            }
        }

        setInterval(() => {
            if (!isScanned || window.currentMood === 'urgent') return;
            
            const fxLayer = document.getElementById('ambient-fx');
            const p = document.createElement('div');
            p.className = 'bg-particle';
            
            let symbols = ['❤️', '💕']; 
            if(window.currentMood === 'miss') symbols = ['✨', '🫧'];

            p.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            p.style.left = `${Math.random() * 100}vw`;
            p.style.animationDuration = `${Math.random() * 6 + 6}s`; 
            p.style.opacity = Math.random() * 0.2 + 0.05; 
            p.style.fontSize = `${Math.random() * 1.5 + 0.5}rem`;
            
            fxLayer.appendChild(p);
            setTimeout(() => p.remove(), 12000); 
        }, 800); 

        function triggerDestruct() {
            document.body.style.display = 'none';
            window.location.reload();
        }
        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'hidden') triggerDestruct();
        });
        window.addEventListener("pagehide", triggerDestruct);
    </script>
</body>
</html>
